<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policies</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #222222;
      line-height: 1.6;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 6px;
    }

    .meta {
      font-size: 14px;
      color: #666666;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e5e5e5;
    }

    .policy-list {
      list-style: none;
      padding: 0;
      margin: 16px 0;
    }

    .policy-item {
      padding: 14px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .policy-item h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 2px 0;
      color: #111111;
    }

    .policy-item p {
      margin: 0;
      font-size: 13px;
      color: #666666;
    }

    .policy-item a {
      font-size: 13.5px;
      color: #0366d6;
      text-decoration: none;
      font-weight: 500;
    }

    .policy-item a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid #e5e5e5;
      font-size: 13px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Privacy Policies</h1>
    <div class="meta">
      Legal and privacy disclosures for published applications.
    </div>

    <ul class="policy-list">
      <li class="policy-item">
        <div>
          <h2>Endless Arcade</h2>
          <p>Package: com.aashiqhasnat.endlessarcade</p>
        </div>
        <a href="./racer/">View Policy &rarr;</a>
      </li>
    </ul>

    <div class="footer">
      Contact: <a href="mailto:ashikhasnat30@gmail.com">ashikhasnat30@gmail.com</a>
    </div>
  </div>
</body>
</html>
