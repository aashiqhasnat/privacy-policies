<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policies - Ashik Hasnat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #222222;
      line-height: 1.6;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 15px;
      color: #666666;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e5e5;
    }

    .policy-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }

    .policy-item {
      padding: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .policy-item h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #111111;
    }

    .policy-item p {
      margin: 0;
      font-size: 13.5px;
      color: #666666;
    }

    .policy-item a.link-btn {
      display: inline-block;
      padding: 6px 14px;
      background: #f0f4f8;
      color: #0366d6;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    .policy-item a.link-btn:hover {
      background: #e1e7ee;
    }

    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #e5e5e5;
      font-size: 13px;
      color: #777777;
    }

    a {
      color: #0366d6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Privacy Policies</h1>
    <p class="subtitle">Legal and data privacy disclosures for applications by Ashik Hasnat.</p>

    <ul class="policy-list">
      <li class="policy-item">
        <div>
          <h2>Endless Arcade (Racer)</h2>
          <p>Package: com.aashiqhasnat.endlessarcade &bull; Offline-first 2D racing game</p>
        </div>
        <a href="./racer/" class="link-btn">View Policy &rarr;</a>
      </li>
    </ul>

    <div class="footer">
      &copy; 2026 Ashik Hasnat &bull; Contact: <a href="mailto:ashikhasnat30@gmail.com">ashikhasnat30@gmail.com</a>
    </div>
  </div>
</body>
</html>
